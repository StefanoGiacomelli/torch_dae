[project]
name = "torch-dae"
version = "0.1.0"
description = "Control-plane contracts for PyTorch audio model onboarding."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "jsonschema>=4.25.0",
  "packaging>=26.0",
  "platformdirs>=4.3.0",
  "pydantic>=2.11.0",
  "typer>=0.16.0",
]

[project.scripts]
torch-dae = "torch_dae.cli.main:app"

[dependency-groups]
dev = [
  "build>=1.2.0",
  "hatchling>=1.27.0",
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
  "integration: tests that materialize local synthetic runtime environments",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["torch_dae"]

[tool.coverage.report]
show_missing = true
