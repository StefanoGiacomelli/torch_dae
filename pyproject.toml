[project]
name = "torch-deepaudioembedding"
version = "0.1.0"
description = "torch-dae: an AI skill-based framework for Audio Embedding Models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Stefano Giacomelli", email = "stefano.giacomelli@graduate.univaq.it" },
]
keywords = [
  "audio",
  "audio embeddings",
  "computational auditory scene analysis",
  "deep learning",
  "model onboarding",
  "pytorch",
  "research software",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Sound/Audio",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.25.0",
  "packaging>=26.0",
  "platformdirs>=4.3.0",
  "pydantic>=2.11.0",
  "typer>=0.16.0",
]

[project.urls]
Homepage = "https://github.com/StefanoGiacomelli/torch_dae"
Repository = "https://github.com/StefanoGiacomelli/torch_dae"
Issues = "https://github.com/StefanoGiacomelli/torch_dae/issues"
Documentation = "https://torch-dae.readthedocs.io/en/latest/"

[project.scripts]
torch-dae = "torch_dae.cli.main:app"

[project.optional-dependencies]
docs = [
  "furo>=2024.8,<2026",
  "myst-parser>=4,<5",
  "sphinx>=8.2,<9",
]

[dependency-groups]
dev = [
  "build>=1.2.0",
  "hatchling>=1.27.0",
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "pytest-cov>=6.2.0",
  "pyyaml>=6,<7",
  "ruff>=0.12.0",
  "twine>=6.1,<7",
]
docs = [
  "furo>=2024.8,<2026",
  "myst-parser>=4,<5",
  "sphinx>=8.2,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torch_dae"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
  "integration: tests that materialize local synthetic runtime environments",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["torch_dae"]

[tool.coverage.report]
show_missing = true
